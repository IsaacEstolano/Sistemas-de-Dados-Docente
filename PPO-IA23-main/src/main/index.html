<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIDD</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <script defer async src="main.js"></script>
</head>

<body>
  <header class="d-flex justify-content-between align-items-center p-3 shadow-sm ">
    <div id="logo" class="d-flex align-items-center gap-2">
      <img src="/icons/ifc.png" alt="IFC Logo" width="200" height="66">
      <div class="d-flex flex-column">
        <span class="fw-bold">INSTITUTO FEDERAL</span>
        <span>Catarinense</span>
        <span>Campus Camboriú</span>
      </div>
    </div>

    <div id="dark_mode_button">
      <input type="checkbox" class="alanjesus form-check-input" style="width:1.5rem;height:1.5rem;">
    </div>
  </header>
  <main class="container my-5">
    <h1 class="text-center mb-4">Sistema de Dados Docentes do IFC Campus Camboriú</h1>

    <div class="search-bar d-flex justify-content-center mb-4">
      <input type="text" spellcheck="false" class="searchInput form-control" placeholder="Pesquisar..."
        style="max-width: 600px;">
    </div>

    <ul class="search-results list-unstyled w-75 mx-auto">
    </ul>

    <div class="mostrador-pagina text-center fw-semibold"></div>

    <div class="d-flex justify-content-center gap-2">
      <button class="back btn btn-primary">Voltar</button>
      <button class="forward btn btn-primary">Avançar</button>
    </div>
  </main>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <button class="close">&times;</button>
      <p></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
